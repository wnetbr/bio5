<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bio Musical Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body{
    height:100vh;
    overflow:hidden;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;

    background: linear-gradient(-45deg, #020024, #001f3f, #0077ff, #00d4ff);
    background-size: 400% 400%;
    animation: bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Fundo animado */
.bg-icons span{
    position:absolute;
    bottom:-60px;
    font-size:18px;
    opacity:0.6;
    animation: float linear infinite;
}

@keyframes float{
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    40%{opacity:1;}
    100%{transform:translateY(-120vh) rotate(360deg);opacity:0;}
}

/* Card principal */
.container{
    width:100%;
    max-width:340px;
    padding:25px 20px;
    border-radius:25px;

    backdrop-filter: blur(18px);
    background: rgba(255,255,255,0.06);

    box-shadow: 0 0 40px rgba(0,150,255,0.3);

    text-align:center;

    animation: fade 1.2s ease;
}

/* Entrada */
@keyframes fade{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}

/* Clave */
.music-icon{
    font-size:42px;
    color:#00d4ff;
    text-shadow:0 0 15px #00d4ff;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.2);}
}

/* Foto */
.profile img{
    width:110px;
    height:110px;
    border-radius:50%;
    margin-top:10px;
    border:3px solid #00d4ff;
    box-shadow:0 0 20px #00d4ff;
}

/* Nome */
h1{
    margin-top:12px;
    font-size:20px;
}

/* Bio */
.bio{
    font-size:13px;
    opacity:0.8;
    margin-bottom:18px;
}

/* Links */
.links a{
    display:block;
    margin:8px auto;
    width:100%;
    padding:13px;
    border-radius:30px;
    text-decoration:none;
    color:white;
    font-size:14px;

    background:linear-gradient(45deg,#0077ff,#00d4ff);

    position:relative;
    overflow:hidden;

    transition:0.25s;
}

/* brilho */
.links a::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.5),transparent);
}

.links a:active{
    transform:scale(0.96);
}

/* Hover só em desktop */
@media(hover:hover){
    .links a:hover::before{
        left:100%;
        transition:0.5s;
    }
    .links a:hover{
        transform:scale(1.05);
        box-shadow:0 0 15px #00d4ff;
    }
}

/* Mobile ajuste */
@media(max-width:480px){
    .container{
        border-radius:20px;
        padding:20px 15px;
    }

    h1{font-size:18px;}
}

/* Safe area (iPhone notch) */
body{
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
}
</style>
</head>

<body>

<div class="bg-icons" id="bg"></div>

<div class="container">

    <div class="music-icon">𝄞</div>

    <div class="profile">
        <img src="https://i.imgur.com/2DhmtJ4.jpg">
    </div>

    <h1>Seu Nome Artístico</h1>
    <p class="bio">🎻 Louvores | Música Instrumental 🎶</p>

    <div class="links">
        <a href="#">Instagram</a>
        <a href="#">YouTube</a>
        <a href="#">Spotify</a>
        <a href="#">WhatsApp</a>
    </div>

</div>

<script>
const icons = ["♪","♫","♩","♬","🎻"];

function criar(){
    const el = document.createElement("span");
    el.innerText = icons[Math.floor(Math.random()*icons.length)];

    el.style.left = Math.random()*100 + "vw";
    el.style.fontSize = (14 + Math.random()*26) + "px";
    el.style.animationDuration = (6 + Math.random()*6) + "s";

    document.getElementById("bg").appendChild(el);

    setTimeout(()=>el.remove(),12000);
}

setInterval(criar,280);
</script>

</body>
</html>
